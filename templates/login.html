<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jasuke Puspem</title>
    <!-- Bagian style ini (CSS) fungsinya buat ngatur UI/desain biar cakep -->
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f3f4f6; /* Warna *background* abu-abu muda */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
        }
        .login-box { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1); 
            text-align: center;
            width: 300px;
        }
        .login-box h2 { color: #d97706; /* Warna oranye/kuning jagung */ }
        input { 
            width: 90%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #f59e0b; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover { background-color: #d97706; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Kasir Jasuke</h2>
        <p>Silakan masuk</p>
        
        <!-- Saat tombol diklik, dia bakal pindah ke rute '/kasir' yang udah kita bikin di app.py -->
        <form action="/kasir">
            <input type="text" placeholder="Username (misal: admin)" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Masuk Aplikasi</button>
        </form>
    </div>

</body>
</html>
