<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kasir Jasuke</title>
    <style>
        body { font-family: Arial; background-color: #f3f4f6; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d97706; text-align: center; }
        button { width: 100%; padding: 12px; background-color: #f59e0b; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold;}
    </style>
</head>
<body>
    <div class="container">
        <h2>Input Pesanan</h2>
        <form action="/proses_pesanan" method="POST">
            <h3>Ukuran:</h3>
            <input type="radio" name="ukuran" value="Cup Kecil" required> Cup Kecil (Rp10.000)<br>
            <input type="radio" name="ukuran" value="Cup Besar"> Cup Besar Mozzarella (Rp15.000)
            
            <h3>Rasa:</h3>
            <input type="radio" name="rasa" value="Original" required> Original<br>
            <input type="radio" name="rasa" value="Keju"> Keju<br>
            <input type="radio" name="rasa" value="Coklat"> Coklat<br>
            <input type="radio" name="rasa" value="Pedas Manis"> Pedas Manis<br>
            
            <button type="submit">Simpan Pesanan</button>
        </form>
    </div>
</body>
</html>
